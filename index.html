<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Angle Encoder</title>
    <style>
        :root {
            --background: #000;
            --bright: #00ff41;
            --mid: #008f11;
            --dark: #003b00;
            --dim: #0f4d1c;
            --glow: 0 0 6px rgba(0, 255, 65, 0.7);
        }

        /* The page fills exactly one screen: the dial shrinks to whatever
           height is left after the code history and the footer. */
        body {
            font-family: Consolas, ui-monospace, monospace;
            margin: 0;
            padding: 16px 24px;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--bright);
            background: var(--background);
        }

        .layout {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            grid-template-rows: minmax(0, 1fr);
            gap: 24px;
        }

        .sidebar {
            grid-column: span 2;
            min-height: 0;
            overflow-y: auto;
        }

        .main {
            grid-column: span 10;
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
            gap: 12px;
        }

        .dial-box {
            min-height: 0;
            container-type: size;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .layers-panel {
            margin-top: 16px;
            font-size: 12px;
        }

        @media (max-width: 800px) {
            body {
                height: auto;
            }

            .layout {
                grid-template-rows: none;
            }

            .sidebar,
            .main {
                grid-column: 1 / -1;
            }

            .dial-box {
                height: min(100vw - 48px, 80vh);
            }
        }

        .layers-header,
        #layers li {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 1px 6px;
        }

        .layers-header {
            color: var(--mid);
            border-bottom: 1px solid var(--dark);
            margin-bottom: 4px;
        }

        #layers {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #layers li {
            cursor: default;
            border-radius: 2px;
        }

        #layers li:hover {
            color: var(--background);
            background: var(--bright);
            box-shadow: var(--glow);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
            color: var(--mid);
        }

        input,
        button {
            font: inherit;
            color: var(--bright);
            background: var(--background);
            border: 1px solid var(--mid);
            border-radius: 2px;
            padding: 4px 6px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--bright);
            box-shadow: var(--glow);
        }

        button {
            align-self: flex-start;
            cursor: pointer;
        }

        button:hover {
            color: var(--background);
            background: var(--bright);
            box-shadow: var(--glow);
        }

        #recommendations {
            margin: 12px 0 0;
            font-size: 14px;
            line-height: 1.5;
            text-shadow: var(--glow);
        }

        footer {
            flex: none;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid var(--dark);
            font-size: 13px;
            text-align: center;
        }

        a {
            color: var(--bright);
        }

        a:hover {
            text-shadow: var(--glow);
        }

        #dial {
            display: block;
            width: min(100cqw, 100cqh);
            height: min(100cqw, 100cqh);
            touch-action: none;
        }

        #history {
            justify-self: center;
            max-width: 100%;
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 12px;
            /* Room for all five rows, so the dial does not jump as they fill. */
            min-height: calc(5 * 24px);
        }

        #history li {
            display: flex;
            gap: 12px;
            padding: 4px 0;
            line-height: 16px;
            color: var(--mid);
            opacity: 0.6;
        }

        #history li:first-child {
            color: var(--bright);
            font-weight: 600;
            opacity: 1;
        }

        #history .angle {
            flex: none;
            width: 56px;
            text-align: right;
        }

        #history .density {
            flex: none;
            width: 48px;
            text-align: right;
        }

        #history .code {
            word-break: break-all;
            color: var(--dim);
        }

        #history .code .one {
            color: var(--bright);
            font-weight: 700;
            text-shadow: var(--glow);
        }

        #history .code .diff {
            color: var(--background);
            background: var(--bright);
            border-radius: 2px;
            text-shadow: none;
            box-shadow: var(--glow);
        }
    </style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
    <form id="params">
        <label>
            Длина кода
            <input name="codeLength" type="number" value="128" min="1">
        </label>
        <label>
            Слоёв
            <input name="layersCount" type="number" value="22" min="2">
        </label>
        <label>
            Перекрытие
            <input name="overlap" type="number" value="0.4" min="0" max="0.99" step="0.01">
        </label>
        <label>
            Детекторов в широком слое
            <input name="widestDetectors" type="number" value="2" min="1">
        </label>
        <label>
            Детекторов в узком слое
            <input name="narrowestDetectors" type="number" value="180" min="1">
        </label>
        <button type="submit">Пересоздать энкодер</button>
    </form>

    <p id="recommendations">
        Рекомендуемая плотность кодов: 25%<br>
        Рекомендуемое перекрытие детекторов: 40%
    </p>

    <div class="layers-panel">
        <div class="layers-header"><span>Слой</span><span>Дет.</span></div>
        <ol id="layers"></ol>
    </div>
</aside>

<main class="main">
    <div class="dial-box">
        <canvas id="dial"></canvas>
    </div>

    <ol id="history"></ol>
</main>
</div>

<footer>
    <a href="https://arxiv.org/pdf/2508.00869" target="_blank" rel="noopener">Статья на arXiv: 2508.00869</a>
</footer>

    <script src="encoder.js"></script>
    <script src="main.js"></script>
</body>
</html>
